name: Release
on:
  push:
    tags: ['v*']
  # Creates the tag and release from the chosen ref when a tag cannot be pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0 (must match package.json version)'
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Tag must match package.json version
        shell: bash
        run: test "${RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage distribution
        shell: bash
        run: node scripts/package-release.mjs ${{ matrix.label }} dist-release
      - name: Smoke-test staged distribution
        shell: bash
        working-directory: dist-release
        run: |
          cd privanet-*-${{ matrix.label }}
          node --input-type=module -e "import('@privanet/protocol').then(p => { if (p.PROTOCOL_VERSION < 1) process.exit(1); }); import('@privanet/sdk'); import('@privanet/node/daemon'); import('@privanet/coordinator/service')"
      - name: Archive
        shell: bash
        working-directory: dist-release
        run: |
          dir=$(ls -d privanet-*-${{ matrix.label }})
          if [ "${{ matrix.label }}" = windows ]; then tar -a -cf "$dir.zip" "$dir"; else tar -czf "$dir.tar.gz" "$dir"; fi
          rm -rf "$dir"; ls -l
      - name: Pack the installable packages (once, on Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          npm pack --workspace @privanet/protocol --workspace @privanet/shared --workspace @privanet/sdk --pack-destination dist-release
          # A dry run of the registry publish catches metadata problems before a tag can fail halfway.
          tag=latest; case "$RELEASE_TAG" in *-*) tag=next;; esac
          for pkg in protocol shared sdk; do npm publish --workspace @privanet/$pkg --access public --tag "$tag" --dry-run; done
          ls -l dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { path: assets, pattern: dist-*, merge-multiple: true }
      - name: Checksums and release notes
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          node scripts/changelog-section.mjs "$RELEASE_TAG" > notes.md
          printf '\nRequires Node.js >= 24.4. Verify downloads against SHA256SUMS.txt. See docs/development.md to run.\n' >> notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; case "$RELEASE_TAG" in *-*) prerelease="--prerelease";; esac
          # A pushed tag must already exist; a dispatch creates it at the exact commit that was built.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target="--target $GITHUB_SHA"; else target="--verify-tag"; fi
          # A re-run of the same tag (for example to complete the npm publish after setting NPM_PUBLISH) must not fail here.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "Release $RELEASE_TAG already exists: leaving it and its assets untouched"; exit 0; fi
          gh release create "$RELEASE_TAG" assets/* --title "PrivaNet ${RELEASE_TAG#v}" --notes-file notes.md $target $prerelease
  publish:
    # Publishes @privanet/protocol, shared and sdk to the public npm registry.
    # Preferred: npm trusted publishing (GitHub OIDC): no long-lived token. Each package must have this repository and
    # the workflow file `release.yml` registered as its trusted publisher on npmjs.com (see docs/PACKAGES.md).
    # Fallback: an NPM_TOKEN secret, used only if it exists. Runs only when the repository variable NPM_PUBLISH is 'true',
    # so a release stays green until the one-time npm setup is done. The GitHub release tarballs are unaffected.
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - run: npm run build
      - name: Publish @privanet/protocol, shared and sdk
        env:
          # Empty when no token is configured, which leaves npm on the OIDC trusted-publisher path.
          FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FALLBACK_NPM_TOKEN" ]; then echo "Using the NPM_TOKEN fallback"; npm config set "//registry.npmjs.org/:_authToken" "$FALLBACK_NPM_TOKEN"; else echo "Using npm trusted publishing (OIDC)"; fi
          version="${RELEASE_TAG#v}"
          tag=latest; case "$RELEASE_TAG" in *-*) tag=next;; esac
          for pkg in protocol shared sdk; do   # dependency order
            if npm view "@privanet/$pkg@$version" version >/dev/null 2>&1; then echo "@privanet/$pkg@$version is already on npm: skipping"; continue; fi
            npm publish --workspace "@privanet/$pkg" --access public --tag "$tag" --provenance
          done
  registry-smoke:
    # Proves what a consumer gets: a clean project installs the freshly published SDK from the registry, resolves one matching
    # protocol/shared/sdk set, and imports it. Not part of `npm test`, so ordinary test runs never depend on the network.
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install from the public registry and import
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"; tag=latest; case "$RELEASE_TAG" in *-*) tag=next;; esac
          # The registry can take a short while to serve a version that was just published.
          for attempt in 1 2 3 4 5 6; do node scripts/registry-smoke.mjs "$version" "$tag" && exit 0; echo "attempt $attempt failed; retrying"; sleep 20; done
          exit 1
