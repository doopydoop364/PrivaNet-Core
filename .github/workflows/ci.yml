name: Core validation
on: [push, pull_request]
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  multinode:
    # Real Coordinator and PrivaNode processes that are killed, paused and restarted (docs/MULTI_NODE_VALIDATION.md). POSIX only; not part of the per-OS default suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:multinode
  lan:
    # Separate-host deployment validation (docs/DEPLOYMENT_VALIDATION.md): network namespaces, iptables, a real Caddy with its own CA, the staged release binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y caddy iproute2 iptables
      - run: sudo systemctl disable --now caddy || true
      - run: npm ci
      # PRIVANET_REQUIRE_LAN: a skipped test counts as a pass, so without it a missing tool or privilege would leave this job green with no deployment-validation coverage.
      # Passed through `sudo env` because sudo drops the caller's environment.
      - run: sudo env "PATH=$PATH" PRIVANET_REQUIRE_LAN=1 npm run test:lan
  proxy:
    # The public-hostname route rules (deploy/caddy/public-routes.caddy) in front of a real Coordinator, run by a real Caddy, and the exposure checker run against them from outside (docs/PUBLIC_NODE.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y caddy
      - run: sudo systemctl disable --now caddy || true
      - run: npm ci
      # PRIVANET_REQUIRE_CADDY: a skipped test counts as a pass, so without it a missing caddy binary would leave this job green with none of the exposure coverage.
      - run: PRIVANET_REQUIRE_CADDY=1 npm run test:proxy
